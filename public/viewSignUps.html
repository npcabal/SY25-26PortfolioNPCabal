<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>View Signups</title>
    <link rel="stylesheet" href="styles.css"/>
    <style>
        tr:nth-child(odd) {
            background-color: lightgray;
        }

        p {
            color: blue;
        }
    </style>
</head>
<body>
  <form>
    <fieldset><br>
      <label><strong>Signups</strong></label>
    </fieldset>
    <fieldset><label>Here are the signups</label></fieldset> 
    <button type="button" onclick="displaySignups()">View Signups</button>
    <table id="results" border="1">
      <thead>
        <tr>
          <th>Student ID</th>
          <th>Full Name</th>
          <th>Birthday</th>
          <th>Email</th>
          <th>Mobile</th>
          <th>Grade Level</th>
          <th>Status</th>
          <th>Club</th>
          <th>Reason</th>
        </tr>
      </thead>
      <tbody>
        <!-- Signups will be dynamically added here -->
      </tbody>
    </table>
    <p id="count"></p>
  </form>

  <script>
    function displaySignups() {
      // Retrieve signups from localStorage
      const signups = JSON.parse(localStorage.getItem('Q3_2GBeCabalSignups')) || [];

      // Get the table body element
      const tableBody = document.querySelector('#results tbody');
      tableBody.innerHTML = ''; // Clear existing rows

      // Populate the table with signups
      signups.forEach((signup) => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${signup.studentID}</td>
          <td>${signup.fullName}</td>
          <td>${signup.birthday}</td>
          <td>${signup.email}</td>
          <td>${signup.mobile}</td>
          <td>${signup.gradeLevel}</td>
          <td>${signup.status}</td>
          <td>${signup.club}</td>
          <td>${signup.reason}</td>
        `;
        tableBody.appendChild(row);
      });

      // Update the count
      document.getElementById('count').textContent = `Total Signups: ${signups.length}`;
    }
  </script>
  <button type="button" onclick="window.location.href='Q3_2GBeCabal.html'">Back</button>
</body>
</html>
