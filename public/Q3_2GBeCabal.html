<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Club Application Form!!</title>
  <link rel="stylesheet" href="../styles.css"/>
</head>
<body>
  <form onsubmit="saveForm(event)" onreset="return confirm('Do you really want to reset the form?');">

    <!-- student info -->
    <fieldset><br>
      <label><strong>Welcome to the SY 25-26 Club Application Form!! 😍👻🦶👅👅</strong></label>
    </fieldset>
    <fieldset>
      <label><i>* means required</i></label>
    </fieldset>
    
    <fieldset>
      <legend>Personal Information</legend>
      <label>
        *Student ID:
        <input type="number" name="studentID" required>
      </label>
      <label>
        *Full Name:
        <input type="text" name="fullName" required>
      </label>
      <label>
        *Birthday:
        <input type="date" name="birthday" required>
      </label>
      <label>
        *Email Address:
        <input type="email" name="email" required>
      </label>
    </fieldset>

    <!-- contact & acad info -->
    <fieldset>
      <legend>Academic & Contact Information</legend>
      <label>
        *Mobile Phone:
        <input type="text" name="mobile" required>
      </label>
      <label>
        *Grade Level:
        <select name="gradeLevel" required>
          <option value="">--Select Grade Level--</option>
          <option value="G7">Grade 7</option>
          <option value="G8">Grade 8</option>
          <option value="G9">Grade 9</option>
          <option value="G10">Grade 10</option>
          <option value="G11">Grade 11</option>
          <option value="G12">Grade 12</option>
        </select>
      </label>
    </fieldset>

    <!-- internship -->
    <fieldset>
      <legend>Internship Status</legend>
      <label>*Select one:</label>
      <label>
        <input type="radio" name="status" value="intern" required> Intern
      </label>
      <label>
        <input type="radio" name="status" value="extern" required> Extern
      </label>
    </fieldset>

    <!-- club preference -->
    <fieldset>
      <legend>Club Preference</legend>
      <label>
        *Preferred Organization / Club:
        <select name="club" required>
          <option value="">-select-</option>
          <option value="science">Science Club</option>
          <option value="math">Math Club</option>
          <option value="arts">Arts Club</option>
          <option value="sports">Sports Club</option>
          <option value="music">Music Club</option>
        </select>
      </label>
      <label>
        *Why do you want to join?
        <textarea name="reason" rows="4" required></textarea>
      </label>
    </fieldset>

    <!-- buttons -->
    <div class="buttons">
      <button type="submit">Submit</button>
      <button type="reset">Reset</button>
      <button type="button" onclick="window.location.href='viewSignUps.html'">View Signups</button>
      <button type="button" onclick="window.location.href='../index.html'">Index</button>
    </div>
  </form>

  <script>
    function saveForm(event) {
      event.preventDefault(); // Prevent the form from submitting to the server

      // Retrieve form data
      const studentID = document.querySelector('input[name="studentID"]').value;
      const fullName = document.querySelector('input[name="fullName"]').value;
      const birthday = document.querySelector('input[name="birthday"]').value;
      const email = document.querySelector('input[name="email"]').value;
      const mobile = document.querySelector('input[name="mobile"]').value;
      const gradeLevel = document.querySelector('select[name="gradeLevel"]').value;
      const status = document.querySelector('input[name="status"]:checked')?.value;
      const club = document.querySelector('select[name="club"]').value;
      const reason = document.querySelector('textarea[name="reason"]').value;

      // Validate required fields
      if (!studentID || !fullName || !birthday || !email || !mobile || !gradeLevel || !status || !club || !reason) {
        alert('Please fill out all required fields.');
        return;
      }

      // Create a signup object
      const signup = {
        studentID,
        fullName,
        birthday,
        email,
        mobile,
        gradeLevel,
        status,
        club,
        reason
      };

      // Retrieve existing signups from localStorage
      const signups = JSON.parse(localStorage.getItem('Q3_2GBeCabalSignups')) || [];

      // Add the new signup to the array
      signups.push(signup);

      // Save the updated array back to localStorage
      localStorage.setItem('Q3_2GBeCabalSignups', JSON.stringify(signups));

      // Notify the user
      alert('Your application has been saved!');
    }
  </script>
</body>
</html>
