<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Movie Database</title>
  <link rel="stylesheet" href="../../styles.css"/>
</head>
<body>
  <form onsubmit="addMovie(event)" onreset="reset();">
    <fieldset>
      <label><legend>Add a Movie</legend></label><br>
      
      <label>
        Title:
        <input type="text" id="title" required>
      </label>
      
      <label>
        Year:
        <input type="number" id="year" min="1800" max="2100">
      </label>
      
      <label>
        Genre:
        <select id="genre">
          <option value="Action">Action</option>
          <option value="Comedy">Comedy</option>
          <option value="Drama">Drama</option>
          <option value="Horror">Horror</option>
          <option value="Romance">Romance</option>
          <option value="Sci-Fi">Sci-Fi</option>
          <option value="Thriller">Thriller</option>
        </select>
      </label>
      
      <label>
        Rating:
        <div class="stars" id="ratingStars">
          <span class="star" data-value="1">★</span>
          <span class="star" data-value="2">★</span>
          <span class="star" data-value="3">★</span>
          <span class="star" data-value="4">★</span>
          <span class="star" data-value="5">★</span>
        </div>
        <input type="hidden" id="rating" value="0">
      </label>
    </fieldset>
    
    <div class="buttons">
      <button type="submit">Add Movie</button>
      <button type="reset">Reset</button>
      <button type="button" onclick="window.location.href='../../index.html'">Index</button>
    </div><br>
  </form><br>

  <form>
    <fieldset>
      <label><legend>Movie List</legend></label>
      <div id="movieList"></div>
    </fieldset>
  </form>

  <script>
    let movies=JSON.parse(localStorage.getItem('movies'))||[];
    let currentRating=0;

    // Star rating
    const stars=document.querySelectorAll('.star');
    stars.forEach(star =>{
      star.addEventListener('click',function(){
        currentRating=this.getAttribute('data-value');
        document.getElementById('rating').value=currentRating;
        updateStarDisplay();
      });
      
      star.addEventListener('mouseover',function(){
        const hoverValue=this.getAttribute('data-value');
        stars.forEach(s =>{
          s.classList.toggle('filled',s.getAttribute('data-value')<=hoverValue);
        });
      });
    });

    document.getElementById('ratingStars').addEventListener('mouseleave',updateStarDisplay);

    function updateStarDisplay(){
      stars.forEach(star =>{
        star.classList.toggle('filled',star.getAttribute('data-value')<=currentRating);
      });
    }

    function addMovie(event){
      event.preventDefault();
      
      const title=document.getElementById('title').value;
      const year=document.getElementById('year').value;
      const genre=document.getElementById('genre').value;
      const rating=document.getElementById('rating').value;

      if (title.trim()===''){
        alert('Enter a movie title!!! 😠');
        return;
      }

      const movie={
        id:Date.now(),
        title,
        year,
        genre,
        rating
      };

      movies.push(movie);
      localStorage.setItem('movies', JSON.stringify(movies));
      
      displayMovies();
      
      // Reset
      document.querySelector('form').reset();
      currentRating=0;
      updateStarDisplay();
    }

    function displayMovies(){
      const movieList=document.getElementById('movieList');
      movieList.innerHTML='';

      if(movies.length===0){
        movieList.innerHTML='<fieldset><label>No movies added yet.</label></fieldset>';
        return;
      }

      movies.forEach(movie=>{
        const stars='★'.repeat(movie.rating)+'☆'.repeat(5-movie.rating);
        const movieDiv=document.createElement('div');
        movieDiv.className='movie-item';
        movieDiv.innerHTML=`
          <strong>${movie.title}</strong> (${movie.year}) - 
          ${movie.genre}<br>
          Rating: ${stars} (${movie.rating}/5)
          <button type="button" style="margin-top: 8px; padding: 4px 8px; font-size: 12px;" onclick="deleteMovie(${movie.id})">Delete</button>
        `;
        movieList.appendChild(movieDiv);
      });
    }

    function deleteMovie(id){
      movies=movies.filter(m=>m.id!==id);
      localStorage.setItem('movies',JSON.stringify(movies));
      displayMovies();
    }

    function reset(){
      currentRating=0;
      updateStarDisplay();
    }

    // Display movies on load
    displayMovies();
  </script>
</body>
</html>
